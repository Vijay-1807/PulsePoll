# Full stack for a single-VPS / Docker-host deployment:
#   docker compose -f docker-compose.prod.yml up -d --build
# Put your TLS terminator (Caddy/Traefik/nginx) in front of the frontend port.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: "8080"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: pulsepoll
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  redis-data:
